[project]
name = "pople-logging"
version = "0.1.0"
description = "Logging for pople services"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
addopts = "--maxfail=1 --cov=pople_logging --cov-report term-missing"

[tool.ty.environment]
python = "../../.venv"
