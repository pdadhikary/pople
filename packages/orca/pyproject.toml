[project]
name = "orca"
version = "0.1.0"
description = "Library for incrementally parsing orca output files."
readme = "README.md"
authors = [
    { name = "Deepta", email = "deeptoadhikary@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "snakeviz>=2.2.2",
]

[tool.pytest.ini_options]
addopts = "--maxfail=1 --cov-report html --cov"

[tool.ty.environment]
python = "../../.venv"
